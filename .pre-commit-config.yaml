repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff lint
        entry: uv run ruff check
        language: system
        types: [python]
        exclude: ^(\.agents|\.dev-standard|tools/(portable_python|quintflow|render_requirements|render_skills|safe_io|spec_mapping)\.py)
      - id: ruff-format
        name: Ruff format
        entry: uv run ruff format --check
        language: system
        types: [python]
        exclude: ^(\.agents|\.dev-standard|tools/(portable_python|quintflow|render_requirements|render_skills|safe_io|spec_mapping)\.py)
      - id: frontend-format
        name: Frontend Prettier
        entry: npm --prefix frontend run format:check
        language: system
        pass_filenames: false
        files: ^frontend/.*\.(ts|tsx|css)$
      - id: private-key
        name: Reject private keys
        entry: python tools/check_secrets.py
        language: system
        types: [text]
      - id: sqlfluff
        name: SQLFluff PostgreSQL
        entry: uv run sqlfluff lint
        language: system
        types: [sql]
      - id: sql-codegen
        name: SQL query generation drift
        entry: uv run python tools/generate_queries.py --check
        language: system
        pass_filenames: false
        files: ^(backend/.*\.(py|sql)|tools/generate_queries\.py)$
      - id: markdown-design
        name: Canonical requirements and Markdown drift
        entry: uv run python tools/design.py --check
        language: system
        pass_filenames: false
        files: ^(docs/generated/|spec/requirements/requirements.qnt|tools/(design|requirements_view|frontend_design)\.|backend/.*\.(py|sql)|frontend/(src|e2e)/|infra/)
