services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cornell
      POSTGRES_PASSWORD: local-cornell-only
      POSTGRES_DB: cornell
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["database:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cornell -d cornell"]
      interval: 2s
      timeout: 3s
      retries: 30
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://cornell:local-cornell-only@db:5432/cornell
      AUTH_MODE: local
      LOCAL_AUTH_SECRET: local-development-signing-key-not-for-production
      LOCAL_PASSWORD: cornell-local
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 3s
      timeout: 3s
      retries: 30
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      VITE_AUTH_MODE: local
      API_TARGET: http://backend:8000
    ports: ["127.0.0.1:5173:5173"]
    depends_on:
      backend: {condition: service_healthy}
volumes:
  database:
