[project]
name = "cornell-note-web"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "mangum>=0.19,<1", "psycopg[binary]>=3.2,<4", "PyJWT[crypto]>=2.10,<3", "boto3>=1.40,<2", "sqlglot>=26,<30", "certifi>=2025.1"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["backend/src/app"]
[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "httpx>=0.28,<1",
    "ruff>=0.13,<1",
    "mypy>=1.15,<2",
    "pyright>=1.1",
    "aws-cdk-lib>=2.200,<3",
    "constructs>=10,<11",
    "cdk-nag>=2.35,<3",
    "pre-commit>=4,<5",
    "boto3-stubs[dsql]>=1.43.89",
    "sqlfluff>=4.3,<5",
]
[tool.pytest.ini_options]
testpaths = ["backend/tests", "infra/tests", "tests"]
addopts = "--strict-config --strict-markers"
pythonpath = ["backend/src", "."]
markers = ["integration: requires PostgreSQL"]
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".agents", ".dev-standard", "tools/portable_python.py", "tools/quintflow.py", "tools/render_requirements.py", "tools/render_skills.py", "tools/safe_io.py", "tools/spec_mapping.py"]
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]
[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = ["S101", "S105", "S106"]
"**/conftest.py" = ["S105"]
"tools/*.py" = ["S603", "S607"]
[tool.mypy]
python_version = "3.12"
strict = true
files = ["backend/src"]
[[tool.mypy.overrides]]
module = ["boto3", "botocore.*"]
ignore_missing_imports = true
[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["backend/src"]
extraPaths = ["backend/src"]
