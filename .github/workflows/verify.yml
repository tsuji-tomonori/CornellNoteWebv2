name: Verify and publish quality
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      DATABASE_URL: postgresql://cornell:local-cornell-only@127.0.0.1:5432/cornell
      AUTH_MODE: local
      LOCAL_AUTH_SECRET: testing-only-key-with-at-least-32-characters
      LOCAL_PASSWORD: cornell-local
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.0'
          python-version: '3.12'
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked
      - run: npm ci --prefix frontend
      - run: python tools/quintflow.py setup
      - run: uv run python tools/package_lambda.py
      - run: uv run python -m infra.app
      - name: Generate Markdown from canonical sources
        run: uv run python tools/design.py
      - name: Verify deterministic Markdown
        run: uv run python tools/design.py --check
      - run: docker compose up --build -d --wait
      - run: npx --prefix frontend playwright install --with-deps chromium
      - name: Quality gates
        id: quality
        continue-on-error: true
        run: uv run python tools/quality.py
      - name: Playwright Given When Then
        id: e2e
        continue-on-error: true
        run: npm --prefix frontend run e2e
      - name: Generate report for UI verification
        if: always()
        run: python tools/report.py
      - name: Verify report navigation and screenshot zoom
        id: report_ui
        if: always()
        continue-on-error: true
        run: npm --prefix frontend run test:report
      - name: Commit verified Markdown on dev
        if: steps.quality.outcome == 'success' && steps.e2e.outcome == 'success' && steps.report_ui.outcome == 'success' && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request'
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/generated
          if ! git diff --cached --quiet; then
            git commit -m '📝 docs: 実装由来のMarkdown設計書を自動更新' -m '目的: 正本と生成設計の同期。変更: docs/generatedのみ。要件: REQ-DESIGN。検証: qualityとE2EとレポートUIが成功した生成物。'
            git push origin HEAD:dev
          fi
          VERIFIED_SHA=$(git rev-parse HEAD)
          TREE_SHA=$(git rev-parse HEAD^{tree})
          echo "VERIFIED_SHA=$VERIFIED_SHA" >> "$GITHUB_ENV"
          mkdir -p build
          printf '%s\n%s\n%s\n' "$SOURCE_SHA" "$VERIFIED_SHA" "$TREE_SHA" > build/verified-revision.txt
      - uses: actions/upload-artifact@v4
        if: success() && steps.quality.outcome == 'success' && steps.e2e.outcome == 'success' && steps.report_ui.outcome == 'success' && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request'
        with:
          name: verified-revision
          path: build/verified-revision.txt
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generated-markdown
          path: docs/generated/**/*.md
      - name: Generate report
        if: always()
        run: python tools/report.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-report
          path: reports/
      - name: Require quality, E2E and report UI success
        if: always()
        env:
          QUALITY: ${{ steps.quality.outcome }}
          E2E: ${{ steps.e2e.outcome }}
          REPORT_UI: ${{ steps.report_ui.outcome }}
        run: test "$QUALITY" = success && test "$E2E" = success && test "$REPORT_UI" = success
      - name: Stop services
        if: always()
        run: docker compose down -v
  pages:
    if: always() && github.ref == 'refs/heads/dev' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: quality-report
          path: reports
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: reports
      - uses: actions/deploy-pages@v4
        id: deployment
